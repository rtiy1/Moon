name: Android Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build APK (split per ABI)
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=MOON_SERVER="${{ vars.MOON_SERVER }}"
          --dart-define=MOON_USERNAME="${{ secrets.MOON_USERNAME }}"
          --dart-define=MOON_PASSWORD="${{ secrets.MOON_PASSWORD }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: moon-app-apk
          path: build/app/outputs/flutter-apk/*.apk

      # 每次 push 到 main：滚动更新 latest Release（APK 始终最新）
      - name: Release (rolling latest)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build #${{ github.run_number }}
          prerelease: true
          files: build/app/outputs/flutter-apk/*.apk

      # 打 v* tag：发正式 Release
      - name: Release (tagged)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
